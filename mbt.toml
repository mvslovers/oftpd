schema = 3

[project]
name = "oftpd"
version = "0.1.0-dev"

[toolchain]
mbt = "3.0"
cc370 = "1.6.1"
libc370 = "2.10.1"   # KSDS inserts with vswrite() (libc370#514)

# No [dependencies] yet: nothing calls crypto370 or anything else.

# Shared code, linked into every module and test: the OFTP codec, the
# monitor's client interface (used by the utilities and, later, by ISPF
# dialogs), translation, configuration. Module mains carry no '#'.
# src/mvs/ holds what only runs on MVS (data sets, VSAM); the host tests
# leave it out.
[internal]
sources = ["src/oftp#*.c", "src/mvs/*.c"]

# The monitor: a started task, sole owner of the spool and the partner
# table. AC(1), so it must hold no writable module data.
[module.OFTPD]
sources = ["src/oftpd.c"]
rent = true
reus = true
ac = 1

# The cross-memory SVC routine (internals/xmem.md). Hand-written S/370
# assembler, no C runtime: OFTPD loads it into CSA with __loadhi, patches
# the anchor address into its word at +4 and reserves the SVC slot named
# by SVC= in OFTPPRM. It is entered by the SVC FLIH and never as a
# program, hence startup=false and no main.
[module.OFTPSVC]
sources = ["asm/oftpsvc.asm"]
entry = "OFTPSVC"
startup = false
rent = true
reus = true

# The TSO command and batch utility: a client of the monitor.
[module.OFTP]
sources = ["src/oftp.c"]
rent = false
reus = false

[build.host]
sources = ["src/oftp#*.c"]   # host tests link the shared code as well

# The ISPF dialog: a command under ISPF, from the ISPLLIB concatenation
# (it loads ISPLINK from there), its panels in ispplib/.
[module.OFTPI]
sources = ["src/oftpi.c"]
rent = false
reus = false

[tests]
rent = false        # mbtcheck.h keeps file-static counters
reus = false

[test.TSTVER]
sources = ["test/tstver.c"]

[test.TSTSESS]           # two engines joined by a socket pair; POSIX
sources = ["test/tstsess.c"]
mvs = false

[test.TSTKSDS]           # VSAM on MVS; runs for real only from test/mvs/tstksds.jcl
sources = ["test/mvs/tstksds.c"]
host = false

[test.TSTDSF]            # data sets through the file layer
sources = ["test/mvs/tstdsf.c"]
host = false

[test.TSTSPL]            # the spool; runs for real only from test/mvs/tstspl.jcl
sources = ["test/mvs/tstspl.c"]
host = false

# The cross-memory transport end to end: an unauthorized, problem-state
# program against a RUNNING OFTPD that has SVC= in OFTPPRM. Needs no
# authorization of its own -- that it needs none is the point. Runs for
# real only from test/mvs/tstsvc.jcl (PARM='RUN').
[test.TSTSVC]
sources = ["test/mvs/tstsvc.c"]
host = false

# The SMP installation package (mbt package): the load modules go to
# OFTPD.LINKLIB (SMP's, distribution library OFTPD.AOFTPLOD), samplib/
# and ispplib/ are received as text libraries beside it.
[distribution]
readme = "docs/installation.md"

[smp]
# The id is the release: T + three product letters + the version digits,
# spent exactly once; each release deletes the one before it. No version
# component may exceed 9. TOFT010 is the first level, so nothing to delete.
# It is spent by the 0.1.0-dev prerelease installed on the test systems
# (maintainer, 2026-10-13); the first final release is 0.2.0, TOFT020,
# and it deletes TOFT010.
prefix = "TOFT"
delete = []
prereq = []

[distribution.library.samplib]   # OFTPD.SAMPLIB: PROC, PARMLIB, jobs

[distribution.library.ispplib]   # OFTPD.ISPPLIB: the dialog's panels

# The ISPF dialog over TN3270 (test/tso/ispf.lua), on the screen the
# panels are made for.
[tso.ispf]
size = "80x43"
